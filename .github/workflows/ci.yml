name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Gradle project
        id: gradle
        run: |
          if [ -f gradlew ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No Gradle project yet; skipping build."; fi

      - uses: actions/setup-java@v4
        if: steps.gradle.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gradle.outputs.present == 'true'

      - name: Test, lint and build
        if: steps.gradle.outputs.present == 'true'
        run: ./gradlew --no-daemon test lint assembleDebug

  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse keystores and service configs
        run: |
          bad=$(git ls-files | grep -E '\.(jks|keystore|p12)$|google-services\.json$|local\.properties$' || true)
          if [ -n "$bad" ]; then echo "Committed files that must never be in a public repo:"; echo "$bad"; exit 1; fi
